<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<meta name="theme-color" content="#102846">
<title>資產總覽</title>
<style>
*{box-sizing:border-box}
:root{--text:#182a43;--muted:#718096;--line:#d9e2ea;--bg:#eef4f8;--card:#fff;--green:#17946c;--red:#ef4444;--blue:#3182ce;--gold:#f2a900}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:0}
button,input{font:inherit}.main{max-width:1500px;margin:auto;padding:18px 22px 82px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.header-left{display:flex;gap:12px;align-items:center}.header-logo{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px #b8c5cf55}.icon-svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.header-logo .icon-svg{width:24px;height:24px}.section-title .icon-svg{width:18px;height:18px}.kpi-title{display:flex;align-items:center;gap:7px}h1{margin:0;font-size:23px}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}.update{color:#7a8794;font-size:12px}.refresh{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;margin-left:7px}
.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--card);border:1px solid #dbe5ec;border-radius:11px;padding:17px;box-shadow:0 2px 8px #9eb0bd22}.kpi{min-height:135px}.kpi:nth-child(1){background:linear-gradient(135deg,#effcf7,#fff)}.kpi:nth-child(2){background:linear-gradient(135deg,#fff6ee,#fff)}.kpi:nth-child(3){background:linear-gradient(135deg,#eff6ff,#fff)}.kpi-title{font-weight:800;font-size:17px}.kpi-value{font-size:27px;font-weight:900;margin:13px 0 7px}.growth{color:var(--green);font-size:17px;font-weight:800}.negative{color:var(--red)}.small{font-size:12px;color:var(--muted)}
.grid-home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:11px}.section-title{font-size:17px;font-weight:850;display:flex;align-items:center;gap:8px;margin-bottom:12px}.donut-wrap{display:flex;align-items:center;gap:18px;min-height:170px}.donut{width:170px;height:170px;border-radius:50%;background:#e7edf2;position:relative;flex:none}.donut:after{content:"";position:absolute;inset:45px;background:#fff;border-radius:50%}.legend{flex:1}.legend-row{display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;margin:12px 0;font-size:13px}.dot{width:11px;height:11px;border-radius:50%}.gold-text{color:var(--gold)}.red-text{color:var(--red)}.blue-text{color:var(--blue)}.pct{font-weight:800}
.chart{height:225px;position:relative}.chart svg{width:100%;height:100%;display:block;touch-action:none}.chart-hit{fill:transparent;stroke:transparent;cursor:pointer}.chart-hit:hover{fill:#df492f33}.chart-tooltip{position:absolute;display:none;pointer-events:none;background:#182a43;color:#fff;border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 5px 16px #182a4330;z-index:3}.chart-detail{display:none;margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}.chart-detail.show{display:block}.chart-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:2px}.chart-grid{stroke:#d9e2ea;stroke-width:1}.chart-line{fill:none;stroke:#df492f;stroke-width:3}.chart-point{fill:#df492f}.chart-label{font-size:11px;fill:#718096}.chart-value{font-size:10px;fill:#182a43;font-weight:700}
.goal{margin:17px 0}.goal .goal-head{align-items:flex-start}.goal .goal-right b{font-size:16px}.goal .bar{margin-top:7px}.goal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;gap:12px}.goal-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;line-height:1.25}.goal-right b{font-size:14px;order:-1}.bar{height:13px;border-radius:99px;background:#e4e9ee;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px}.gold{background:var(--gold)}.red{background:var(--red)}.blue{background:var(--blue)}.total-goal{background:var(--green)}.good{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}
.initial-card{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat-box{background:#f5f8fa;border-radius:9px;padding:14px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:22px;font-weight:900;margin-top:6px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{margin-top:11px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{font-weight:800;background:#f4f8fa}th,td{border:1px solid #dbe4ea;padding:7px 6px;text-align:center;white-space:nowrap}.empty{padding:30px;text-align:center;color:var(--muted)}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;background:rgba(255,255,255,.97);border-top:1px solid #d5e0e8;display:flex;justify-content:center;box-shadow:0 -3px 14px #65788822}.nav-inner{width:min(620px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.nav-btn{border:0;background:none;color:#718096;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700}.nav-btn .icon{font-size:23px;line-height:1}.nav-btn.active{color:#173b61}.nav-btn.active .icon{transform:translateY(-1px)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,31,48,.48);z-index:50;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(500px,100%);background:#fff;border-radius:15px;box-shadow:0 20px 70px #0d213844;overflow:hidden}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#eef3f6;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;color:#536273}.form{padding:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid #ccd8e1;border-radius:8px;outline:none}.hint{font-size:12px;color:var(--muted);background:#f5f8fa;border-radius:8px;padding:9px;margin-bottom:15px}.toast{position:fixed;z-index:80;bottom:92px;left:50%;transform:translateX(-50%);background:#17324c;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none}.toast.show{display:block}
@media(max-width:1050px){.grid-home{grid-template-columns:1fr 1fr}.grid-home>.card:last-child{grid-column:1/-1}}
@media(max-width:760px){.main{padding:13px 13px 82px}.header{align-items:flex-start}.update{display:none}.cards,.grid-home,.stats-grid{grid-template-columns:1fr}.grid-home>.card:last-child{grid-column:auto}.initial-card{grid-template-columns:1fr}.donut-wrap{flex-direction:column}.donut{width:155px;height:155px}.long-grid{grid-template-columns:1fr}}

  .allocation-visual{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
  .legend-bottom{width:100%;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
  .legend-bottom .legend-row{display:grid;grid-template-columns:10px auto auto;align-items:center;gap:7px;min-width:auto}
  .daily-table-scroll{max-height:390px;overflow:auto}
  .stock-management-row{display:flex;align-items:center;justify-content:flex-end;gap:16px}
  .stock-management-row .outline-btn{white-space:nowrap}
  .outline-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--text);cursor:pointer}
  .primary-btn{border:0;background:#173b61;color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:800}
  .primary-btn:disabled,.outline-btn:disabled{opacity:.55;cursor:not-allowed}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}
  .edit-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;color:var(--text);cursor:pointer;font-size:12px;font-weight:700}
  .stock-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stock-menu-btn{min-height:48px;font-weight:800}
  .stock-form select{width:100%}
  select{width:100%;padding:11px 12px;border:1px solid #ccd8e1;border-radius:8px;background:#fff;color:var(--text)}
  @media(max-width:520px){.stock-menu-grid{grid-template-columns:1fr}}


  /* V2.3：統計頁第二列並列 */
  .stats-row-initial{grid-template-columns:minmax(0,1fr)}
  .stats-row-goals{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:11px}
  .stats-row-goals>.card{min-width:0}
  @media (max-width:760px){
    .stats-row-goals{grid-template-columns:1fr}
  }

  /* V2.4：每日資產統計期間選擇 */
  .section-heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .range-select-wrap{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .range-select-wrap select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 28px 7px 10px;color:var(--text);font-size:13px;cursor:pointer}
  @media (max-width:520px){
    .section-heading-row{align-items:flex-start}
    .range-select-wrap span{display:none}
  }

  /* V2.5：初始資產三項資訊水平排列 */
  .initial-stats-horizontal{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .initial-stats-horizontal .stat-box{
    min-width:0;
  }
  @media (max-width:760px){
    .initial-stats-horizontal{
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
    }
    .initial-stats-horizontal .stat-value{
      font-size:clamp(17px,4vw,24px);
    }
  }
  @media (max-width:520px){
    .initial-stats-horizontal{
      grid-template-columns:1fr;
    }
  }
  /* V2.10：目標設定 */
  .goal-setting-wrap{display:flex;flex-direction:column;gap:12px}
  .goal-setting-annual{overflow-x:auto}
  .goal-setting-annual table{width:100%;min-width:0;table-layout:fixed}
  .goal-setting-annual th,.goal-setting-annual td{padding:8px 10px;width:50%}
  .goal-setting-long{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .goal-setting-long-card{background:#f5f8fa;border-radius:9px;padding:12px 14px;text-align:center}
  .goal-setting-long-title{font-size:12px;color:var(--muted);font-weight:800}
  .goal-setting-long-value{font-size:22px;font-weight:900;margin-top:5px}
  @media(max-width:520px){
    .goal-setting-long{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .goal-setting-long-card{padding:12px 8px}
    .goal-setting-long-value{font-size:20px}
  }
</style>
</head>
<body>
<main class="main">
<header class="header"><div class="header-left"><div class="header-logo"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg></div><div><h1>資產總覽</h1><div class="subtitle">掌握資產，規劃更好的未來</div></div></div><div class="update"><span id="lastUpdated">資料載入中…</span> <button class="refresh" id="refreshBtn"><svg class="icon-svg" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"></path><path d="M3 5v5h5"></path><path d="M4 13a8 8 0 0 0 14.8 4L21 14"></path><path d="M21 19v-5h-5"></path></svg>更新資料</button></div></header>

<section id="homePage" class="page active">
  <div class="cards">
    <div class="card kpi"><div class="kpi-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path><circle cx="8" cy="14" r="1.5"></circle></svg>總資產</div><div id="totalAsset" class="kpi-value">—</div><div id="totalGrowth" class="growth">—</div><div id="initialSince" class="small">—</div></div>
    <div class="card kpi"><div class="kpi-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16"></path><path d="M5 18 4 8l4 3 4-6 4 6 4-3-1 10"></path></svg>歷史高點</div><div id="highAmount" class="kpi-value">—</div><div class="small">達成日期</div><div id="highDate" style="font-weight:800;margin-top:4px">—</div></div>
    <div class="card kpi"><div class="kpi-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 10 12 14 15 21 7"></path><path d="M15 7h6v6"></path></svg>本月變化</div><div id="monthlyRate" class="kpi-value growth">—</div><div id="monthlyAmount" class="growth">—</div><div id="monthlyRange" class="small">—</div></div>
  </div>

  <div class="grid-home">
    <div class="card"><div class="section-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M12 3v9h9"></path></svg>資產配置</div><div id="allocation" class="donut-wrap"></div></div>
    <div class="card"><div class="section-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 10 12 14 15 21 7"></path><path d="M16 7h5v5"></path></svg>資產成長趨勢</div><div id="trend" class="chart"></div><div id="trendDetail" class="chart-detail"></div><div class="chart-hint">滑動查看日期與金額，點選節點可固定查看</div></div>
    <div class="card"><div class="section-title"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle><path d="m16 8 4-4"></path></svg>資產目標達成率</div><div id="goals"></div></div>
  </div>
</section>

<section id="statsPage" class="page">
  <div class="stats-grid stats-row-initial" style="margin-top:11px">
    <div class="card">
      <div class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
        初始資產
      </div>
      <div id="initialStats"></div>
    </div>
  </div>

  <div class="stats-grid stats-row-goals">
    <div class="card">
      <div class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 18 10 12 14 15 21 7"></path>
          <path d="M16 7h5v5"></path>
        </svg>
        年度資產
      </div>
      <div id="longGoals"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5h14v14H5z"></path>
          <path d="M8 9h8M8 13h5M8 17h3"></path>
        </svg>
        目標設定
      </div>
      <div id="goalSettingsWrap" class="goal-setting-wrap">
         <div class="goal-setting-annual">
           <table id="goalSettingsTable"></table>
         </div>
         <div id="goalSettingLongTerm" class="goal-setting-long"></div>
       </div>
    </div>
  </div>

  <div class="card full">
    <div class="section-title">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5h16v14H4z"></path>
        <path d="M8 9h8M8 13h8M8 17h5"></path>
      </svg>
      每月資產統計（本年度）
    </div>
    <div class="table-scroll">
      <table id="monthlyTable"></table>
    </div>
  </div>

  <div class="card full">
    <div class="section-heading-row">
      <div class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="17" rx="2"></rect>
          <path d="M7 2.5V6.5M17 2.5V6.5"></path>
          <path d="M3 9H21"></path>
          <path d="M7 18V16M10.5 18V14M14 18V15M17.5 18V12"></path>
        </svg>
        每日資產統計
      </div>
      <label class="range-select-wrap" aria-label="每日資產統計期間">
        <span>顯示</span>
        <select id="dailyRange">
          <option value="7" selected>近 7 天</option>
          <option value="15">近 15 天</option>
          <option value="30">近 30 天</option>
          <option value="all">全部</option>
        </select>
      </label>
    </div>
    <div class="table-scroll daily-table-scroll">
      <table id="dailyTable"></table>
    </div>
  </div>

  <div class="card full">
    <div class="section-title">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19h16"></path>
        <path d="M6 16V8h3v8"></path>
        <path d="M11 16V5h3v11"></path>
        <path d="M16 16v-6h3v6"></path>
      </svg>
      投資資產（股票）
    </div>
    <div class="table-scroll compact-table">
      <table id="stockTable"></table>
    </div>
    <div class="stock-management-row" style="margin-top:12px">
      <button id="openStockManagerBtn" class="outline-btn" type="button">股票管理</button>
    </div>
  </div>


</section>
</main>

<nav class="bottom-nav"><div class="nav-inner"><button class="nav-btn active" data-nav="home"><span class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg></span><span>首頁</span></button><button class="nav-btn" data-nav="input"><span class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span>輸入</span></button><button class="nav-btn" data-nav="stats"><span class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"></path><path d="M12 20V5"></path><path d="M19 20V8"></path></svg></span><span>統計</span></button></div></nav>

<div id="modalBackdrop" class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>新增資產紀錄</h2><button id="closeModal" class="close">×</button></div><div class="form"><div class="field"><label>日期</label><input type="date" id="inputDate"></div><div class="field"><label>股票</label><input type="number" id="inputStock" min="0" step="0.01"></div><div class="field"><label>員工儲蓄會</label><input type="number" id="inputSavings" min="0" step="0.01"></div><div class="field"><label>現金</label><input type="number" id="inputCash" min="0" step="0.01"></div><div class="hint" id="modalHint">新增資料會寫入 Google Sheets 的「資產」的副本，並沿用既有公式。</div><div class="modal-actions"><button id="cancelModal" class="outline-btn" type="button">取消</button><button id="saveAssetBtn" class="primary-btn" type="button">儲存</button></div></div></div></div>

<div id="stockModalBackdrop" class="modal-backdrop">
  <div class="modal stock-modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="stockModalTitle">股票管理</h2><button id="closeStockModal" class="close" type="button">×</button></div>
    <div class="form">
      <div id="stockMenuView">
        <div class="hint">既有股票可管理 G2:H15；新增股票只使用 G8:H15。G16 以下其他資料不會被股票功能寫入。</div>
        <div class="stock-menu-grid">
          <button class="primary-btn stock-menu-btn" type="button" data-stock-mode="add">新增</button>
          <button class="outline-btn stock-menu-btn" type="button" data-stock-mode="edit">修改</button>
          <button class="outline-btn stock-menu-btn" type="button" data-stock-mode="delete">刪除</button>
        </div>
      </div>
      <div id="stockFormView" style="display:none">
        <div class="field" id="stockTickerField"><label>代號</label><input id="stockTickerInput" maxlength="12" autocomplete="off" placeholder="例如：0050"></div>
        <div class="field" id="stockTickerSelectField" style="display:none"><label>代號</label><select id="stockTickerSelect"></select></div>
        <div class="field"><label>持有股數</label><input id="stockSharesInput" type="number" min="0" step="0.0001"></div>
        <div class="hint" id="stockFormHint"></div>
        <div class="modal-actions">
          <button id="stockBackBtn" class="outline-btn" type="button">返回</button>
          <button id="stockSaveBtn" class="primary-btn" type="button">儲存</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxMkJCUcpCUyiljb8CwAJgE32wMlaqcfP69yqlbTiDLseu6KtJmgD8FRpnTj8HLiqxAPg/exec";
const EXPECTED_API_VERSION="V2.12-STOCK-RANGE";

const $=id=>document.getElementById(id);

function money(n){
  if(n==null||!Number.isFinite(Number(n)))return"—";
  return"NT$"+Number(n).toLocaleString("zh-TW",{maximumFractionDigits:0});
}

function pct(n,d=1){
  if(n==null||!Number.isFinite(Number(n)))return"—";
  return(Number(n)*100).toFixed(d)+"%";
}

function dateText(s){
  if(!s)return"—";
  return String(s).replaceAll("-","/");
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderTrend(history){
  const pts=(history||[])
    .filter(x=>x&&x.date&&x.amount!=null);

  const detail=$("trendDetail");

  if(!pts.length){
    $("trend").innerHTML=
      `<div class="empty">目前沒有歷史資產資料</div>`;
    detail.classList.remove("show");
    return;
  }

  const w=500,h=220;
  const left=55,right=10,top=15,bottom=15;
  const iw=w-left-right,ih=h-top-bottom;

  const vals=pts.map(x=>Number(x.amount));

  let min=Math.min(...vals);
  let max=Math.max(...vals);

  const pad=Math.max((max-min)*0.08,100000);

  min=Math.max(0,min-pad);
  max=max+pad;

  const span=max-min||1;

  const y=v=>top+(max-v)/span*ih;
  const x=i=>
    left+
    (pts.length===1
      ? iw/2
      : i/(pts.length-1)*iw);

  const line=pts
    .map((p,i)=>
      `${x(i).toFixed(1)},${y(Number(p.amount)).toFixed(1)}`
    )
    .join(" ");

  const grid=[0,.2,.4,.6,.8,1]
    .map(t=>{
      const yy=top+t*ih;
      return `<line class="chart-grid"
        x1="${left}" y1="${yy}"
        x2="${w-right}" y2="${yy}"/>`;
    })
    .join("");

  const years=[];

  pts.forEach((p,i)=>{
    const yr=String(p.date).slice(0,4);
    if(!years.some(g=>g.year===yr)){
      years.push({year:yr,i});
    }
  });

  const labels=years
    .map(g=>
      `<text class="chart-label"
        x="${Math.max(0,Math.min(w-38,x(g.i)-12))}"
        y="${h-1}">${g.year}</text>`
    )
    .join("");

  const hits=pts
    .map((p,i)=>
      `<circle
        class="chart-hit"
        data-index="${i}"
        cx="${x(i)}"
        cy="${y(Number(p.amount))}"
        r="${pts.length>180?5:4}"/>`
    )
    .join("");

  $("trend").innerHTML=`
    <svg id="trendSvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      ${grid}
      <polyline class="chart-line" points="${line}"/>
      ${hits}
      ${labels}
    </svg>
    <div class="chart-tooltip" id="trendTooltip"></div>`;

  const svg=$("trendSvg");
  const tooltip=$("trendTooltip");

  const show=(i,pin=false)=>{
    const p=pts[i];
    if(!p)return;

    tooltip.innerHTML=
      `${dateText(p.date)}<br><strong>${money(p.amount)}</strong>`;

    tooltip.style.display="block";

    const tx=x(i)/w*100;
    const ty=y(Number(p.amount))/h*100;

    tooltip.style.left=
      `${Math.min(78,Math.max(2,tx))}%`;

    tooltip.style.top=
      `${Math.max(2,ty-3)}%`;

    if(pin){
      detail.innerHTML=
        `${dateText(p.date)}　${money(p.amount)}`;
      detail.classList.add("show");
    }
  };

  const hide=()=>{
    tooltip.style.display="none";
  };

  const nearestIndex=(clientX)=>{
    const rect=svg.getBoundingClientRect();
    if(!rect.width)return 0;
    const svgX=((clientX-rect.left)/rect.width)*w;
    const ratio=Math.min(1,Math.max(0,(svgX-left)/iw));
    return pts.length===1 ? 0 : Math.round(ratio*(pts.length-1));
  };

  let touchActive=false;

  svg.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch"){
      touchActive=true;
      svg.setPointerCapture?.(e.pointerId);
      show(nearestIndex(e.clientX),true);
      e.preventDefault();
    }
  });

  svg.addEventListener("pointermove",e=>{
    if(e.pointerType==="touch"){
      if(!touchActive)return;
      show(nearestIndex(e.clientX),true);
      e.preventDefault();
      return;
    }

    if(e.pointerType==="mouse"){
      show(nearestIndex(e.clientX),false);
    }
  });

  svg.addEventListener("pointerup",e=>{
    if(e.pointerType==="touch"){
      show(nearestIndex(e.clientX),true);
      touchActive=false;
      e.preventDefault();
    }
  });

  svg.addEventListener("pointercancel",()=>{touchActive=false;});
  svg.addEventListener("pointerleave",()=>{
    if(!touchActive)hide();
  });

  svg.addEventListener("click",e=>{
    if(e.pointerType==="mouse" || e.pointerType===""){
      show(nearestIndex(e.clientX),true);
    }
  });

  detail.classList.remove("show");
}

async function loadDashboard(){
  const r=await fetch(
    API_URL+"?action=dashboard",
    {
      method:"GET",
      cache:"no-store",
      redirect:"follow"
    }
  );

  if(!r.ok){
    throw new Error(
      "資料服務回應錯誤（HTTP "+r.status+"）"
    );
  }

  const result=await r.json();

  if(!result.ok){
    throw new Error(
      result.message||
      result.error||
      "無法取得資產資料"
    );
  }

  if(result.apiVersion!==EXPECTED_API_VERSION){
    throw new Error(
      "API 版本不符：目前為 "+
      (result.apiVersion||"未知")+
      "，預期為 "+
      EXPECTED_API_VERSION
    );
  }

  if(!result.data){
    throw new Error("API 沒有回傳 data。");
  }

  render(result.data);
}

async function saveAsset(){
  const isEditing=editingRow!==null;
  const payload={
    action:isEditing ? "updateAsset" : "addAsset",
    row:editingRow,
    date:$('inputDate').value,
    stock:$('inputStock').value,
    savings:$('inputSavings').value,
    cash:$('inputCash').value
  };

  if(!payload.date || payload.stock==="" || payload.savings==="" || payload.cash===""){
    showToast("請完整填寫資料");
    return;
  }

  const btn=$('saveAssetBtn');
  btn.disabled=true;
  btn.textContent="儲存中…";

  try{
    const body=new URLSearchParams();
    Object.entries(payload).forEach(([k,v])=>{
      if(v!==null&&v!==undefined) body.append(k,String(v));
    });
    const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()});
    if(!response.ok) throw new Error(`資料服務回應錯誤（HTTP ${response.status}）`);
    const result=await response.json();
    if(!result.ok) throw new Error(result.error||"資料寫入失敗。");
    closeInputModal();
    showToast(isEditing?"修改成功":"新增成功");
    await load();
  }catch(err){
    console.error(err);
    showToast(err.message||"資料寫入失敗");
  }finally{
    btn.disabled=false;
    btn.textContent=isEditing?"儲存修改":"儲存";
  }
}

  const mode=stockMode;
  if(!mode)return;

  const payload={action:mode==='add'?'addStock':mode==='edit'?'updateStock':'deleteStock'};
  if(mode==='add'){
    payload.ticker=$('stockTickerInput').value.trim().toUpperCase();

    if(!payload.ticker||payload.shares===''){showToast('請完整填寫股票代號與持有股數');return;}
  }else{
    payload.row=stockSelectedRow;
    if(!payload.row){showToast('目前沒有可管理的股票');return;}
    if(mode==='edit'&&$('stockSharesInput').value===''){showToast('請填寫持有股數');return;}
    if(mode==='delete'){
      const rec=getStockRows().find(x=>Number(x.row)===Number(payload.row));
      if(!rec)return;
      if(!confirm(`確定要刪除 ${rec.ticker} 嗎？`))return;
    }else{
      payload.shares=$('stockSharesInput').value;
    }
  }

  const btn=$('stockSaveBtn');
  btn.disabled=true;
  btn.textContent='處理中…';
  try{
    const body=new URLSearchParams();
    Object.entries(payload).forEach(([k,v])=>body.append(k,String(v??'')));
    const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
    if(!response.ok)throw new Error(`資料服務回應錯誤（HTTP ${response.status}）`);
    const result=await response.json();
    if(!result.ok)throw new Error(result.error||'股票資料寫入失敗。');
    closeStockManager();
    showToast(mode==='add'?'新增股票成功':mode==='edit'?'修改股票成功':'刪除股票成功');
    await load();
  }catch(err){
    console.error(err);
    showToast(err.message||'股票資料寫入失敗');
  }finally{
    btn.disabled=false;
    btn.textContent=mode==='delete'?'刪除':'儲存';
  }
}

$('openStockManagerBtn').addEventListener('click',openStockManager);
$('closeStockModal').addEventListener('click',closeStockManager);
$('stockBackBtn').addEventListener('click',showStockMenu);
$('stockSaveBtn').addEventListener('click',saveStock);
$('stockModalBackdrop').addEventListener('click',e=>{if(e.target===$('stockModalBackdrop'))closeStockManager();});


$("dailyTable").addEventListener(
  "click",
  e=>{
    const btn=e.target.closest("[data-edit-row]");
    if(!btn)return;

    const row=Number(btn.dataset.editRow);
    const record=dailyStatsCache.find(x=>Number(x.row)===row);

    if(record){
      openInputModal(record);
    }
  }
);


$("modalBackdrop").addEventListener(
  "click",
  e=>{
    if(e.target===$("modalBackdrop")){
      closeInputModal();
    }
  }
);

$("refreshBtn").addEventListener(
  "click",
  ()=>{
    showToast("更新資料中…");
    load();
  }
);

window.addEventListener("load",load);
</script>
</body></html>
